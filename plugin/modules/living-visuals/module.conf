# module.conf: the living-visuals module (.claude/modules/README.md has the interface). Pages that
# state facts about the system (a roadmap page, an ERD, an API map), each registered in the
# artifacts registry with how it is refreshed, its generated blocks and its claims, held TRUE by a
# check: the artifacts module says when a page's sources moved; this says whether what it states
# is still so.
name="living-visuals"
requires="artifacts"
enables="context.d checks skills conflicts.tsv"
# node: every living page's inline scripts must parse (`node --check`; the module's one Node use).
# off: they are not parsed, and the check says so on every page.
LIVING_SCRIPT_CHECK="node"
# Each registry command (a generated block's, a claim's) is stopped after this many seconds.
LIVING_COMMAND_SECONDS="60"
