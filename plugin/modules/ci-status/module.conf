# module.conf: the ci-status module (.claude/modules/README.md has the interface).
# Lowercase keys describe the module; UPPERCASE keys are defaults for .claude/project.conf,
# applied only where the project sets nothing.
name="ci-status"
requires=""
enables="checks"
# The contexts the merge guard ignores in both directions. Every context below must be listed here:
# publish-status.sh refuses to post one that is not, and checks/ci-status.sh fails.
GATE_DISPLAY_CONTEXTS="ci/local ci/github"
# The status the gate runner posts after a full run (scripts/ci/lib/steps.sh model_publish_status).
CI_STATUS_LOCAL_CONTEXT="ci/local"
# The descriptions (140 characters at most): say WHERE the result came from, never just "passed".
# Empty = "<GATE_RUN> passed in full on a clean tree, in the author's clone" and its failure twin.
CI_STATUS_LOCAL_PASS=""
CI_STATUS_LOCAL_FAIL=""
# The status a remote workflow's report job posts (publish-status.sh github <job>=<result>...).
CI_STATUS_REMOTE_CONTEXT="ci/github"
# Empty = "<GATE_REMOTE_WORKFLOW> passed on GitHub: <job> and <job>".
CI_STATUS_REMOTE_PASS=""
