<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hybrid: PANEL-45 mockup</title>
<!-- PANEL-45, variant 4: Hybrid (the owner's mix of Overview first and Stage, 2026-10-16). A still mockup of the panel's new look (changes/panel-45-ui-design,
     design D1 to D3, D6, D11). Self-contained: its CSS, its script and the subset of mockups/data.js it draws are
     inline, so it opens from disk with no network and no build. The terminal is a still of captured text.
     Query parameters: mode=light|dark, view=home|lane (default home), screen=lane|menu|palette|rules, lane=<a lane's name> (default waiting, the lane that needs you). Clicking switches the same states; Escape closes, ⌘K opens the palette,
     R opens the rules. -->
<script>(function(){var m=new URLSearchParams(location.search).get("mode");document.documentElement.dataset.theme=m==="light"||m==="dark"?m:(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")})()</script>
<style>
/* ONE theme, two modes, each set on its own (D3). Light lifts panes with soft shadow on a
   grey page; dark lifts them with a one-pixel light ring on near-black, and keeps real
   shadow for what floats. The terminal is dark in both. */
:root{
  --font-ui: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", system-ui, sans-serif;
  --font-data: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  --font-term: "JetBrains Mono", "SF Mono", ui-monospace, Menlo, Consolas, monospace;
  --r-ctl: 8px; --r-card: 10px; --r-pane: 14px;
  --ease: cubic-bezier(.2,.8,.2,1);
  --term-bg:#0C0D11; --term-head:#121318; --term-line:rgba(255,255,255,.07);
  --t-ink:#D5D8DF; --t-dim:#6B7080; --t-mid:#9AA0AD; --t-green:#5BD38F; --t-cyan:#6CC5EE;
  --t-yellow:#E8C46B; --t-red:#FF7B80; --t-claude:#E38B63; --t-violet:#ABA8FF; --t-link:#80B8FF;
  --side-w: 252px; --pulse-w: 304px;
  color-scheme: light dark;
}
:root[data-theme=light]{
  color-scheme: light;
  --bg:#F2F2F4; --surface:#FFFFFF; --surface-2:#F8F8FA; --sunk:#EDEDF0;
  --hover:rgba(18,20,30,.045); --hover-2:rgba(18,20,30,.075); --track:rgba(18,20,30,.08);
  --line:rgba(18,20,30,.08); --line-2:rgba(18,20,30,.13);
  --ink:#191A20; --ink-2:#555965; --ink-3:#71757F;
  --shadow-1:0 0 0 1px rgba(18,20,30,.06), 0 1px 2px rgba(18,20,30,.05);
  --shadow-2:0 0 0 1px rgba(18,20,30,.06), 0 2px 4px rgba(18,20,30,.04), 0 10px 24px -8px rgba(18,20,30,.12);
  --shadow-pop:0 0 0 1px rgba(18,20,30,.09), 0 4px 10px rgba(18,20,30,.06), 0 24px 56px -12px rgba(18,20,30,.28);
  --shadow-term:0 0 0 1px rgba(18,20,30,.10), 0 12px 32px -10px rgba(18,20,30,.38);
  --scrim:rgba(24,26,34,.28);
  --accent:#5B5BD6; --accent-soft:rgba(91,91,214,.10); --accent-ink:#4646C0; --on-accent:#fff;
  --work:#18A058; --work-soft:rgba(24,160,88,.11); --work-ink:#12733F;
  --wait:#D98307; --wait-soft:rgba(217,131,7,.13); --wait-ink:#9A5A00;
  --need:#E5484D; --need-soft:rgba(229,72,77,.10); --need-ink:#C22A30; --need-ring:rgba(229,72,77,.32);
  --idle:#A3A6B0; --idle-soft:rgba(110,114,126,.10); --idle-ink:#5D616C;
  --seg1:#5B5BD6; --seg2:#7E7DE4; --seg3:#A1A0EE; --seg4:#C1C0F4; --seg5:#DAD9F9; --seg6:#E6E6EC;
  --heat0:#EBEBEF; --heat1:#D7D6F7; --heat2:#ADABF0; --heat3:#8483E6; --heat4:#5B5BD6;
}
:root[data-theme=dark]{
  color-scheme: dark;
  --bg:#0A0A0D; --surface:#141519; --surface-2:#18191E; --sunk:#0F1013;
  --hover:rgba(255,255,255,.04); --hover-2:rgba(255,255,255,.075); --track:rgba(255,255,255,.08);
  --line:rgba(255,255,255,.065); --line-2:rgba(255,255,255,.11);
  --ink:#ECEDEF; --ink-2:#A2A5AF; --ink-3:#7F838E;
  --shadow-1:0 0 0 1px rgba(255,255,255,.06);
  --shadow-2:0 0 0 1px rgba(255,255,255,.065), 0 1px 0 rgba(255,255,255,.03) inset;
  --shadow-pop:0 0 0 1px rgba(255,255,255,.10), 0 28px 64px -12px rgba(0,0,0,.75), 0 4px 12px rgba(0,0,0,.4);
  --shadow-term:0 0 0 1px rgba(255,255,255,.08);
  --term-bg:#08090B; --term-head:#0E0F12;
  --scrim:rgba(0,0,0,.52);
  --accent:#8F8DFF; --accent-soft:rgba(143,141,255,.14); --accent-ink:#ADABFF; --on-accent:#0A0A0D;
  --work:#3CD68A; --work-soft:rgba(60,214,138,.12); --work-ink:#5BE2A0;
  --wait:#F4A62A; --wait-soft:rgba(244,166,42,.13); --wait-ink:#FFC25C;
  --need:#FF6168; --need-soft:rgba(255,97,104,.12); --need-ink:#FF8A8F; --need-ring:rgba(255,97,104,.38);
  --idle:#6E717C; --idle-soft:rgba(255,255,255,.06); --idle-ink:#A2A5AF;
  --seg1:#8F8DFF; --seg2:#7270DE; --seg3:#5A58BE; --seg4:#47469C; --seg5:#38377C; --seg6:#26272F;
  --heat0:#1B1C22; --heat1:#2A2958; --heat2:#3F3D8C; --heat3:#6260C8; --heat4:#8F8DFF;
}
*,*::before,*::after{box-sizing:border-box}
b,strong,h1,h2,h3{font-weight:600}
html,body{height:100%;margin:0}
body{font:400 13px/1.45 var(--font-ui);color:var(--ink);background:var(--bg);overflow:hidden;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.mono,.num{font-family:var(--font-data);font-variant-numeric:tabular-nums lining-nums slashed-zero;font-size:12px}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
svg.i.s{width:14px;height:14px}

/* ---- app frame ---- */
#app{height:100vh;display:grid;grid-template-rows:minmax(0,1fr);grid-template-columns:var(--side-w) minmax(0,1fr);transition:grid-template-columns .32s var(--ease)}
.main{min-width:0;min-height:0;display:flex;flex-direction:column;padding:0 10px 10px 0}
.body{flex:1;min-height:0;display:grid;gap:10px;grid-template-rows:minmax(0,1fr);grid-template-columns:minmax(0,1fr) var(--pulse-w);transition:grid-template-columns .32s var(--ease)}
.col{min-height:0;min-width:0;display:flex;flex-direction:column;gap:10px}
.pane{background:var(--surface);border-radius:var(--r-pane);box-shadow:var(--shadow-2)}
.scroll{overflow:auto;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}

/* ---- sidebar ---- */
.side{min-width:0;min-height:0;display:flex;flex-direction:column;padding:10px 10px 10px 10px;gap:4px;overflow:hidden}
.proj{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:var(--r-card);width:100%}
.proj:hover,.proj.on{background:var(--hover)}
.ptile{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-weight:600;font-size:13px;color:#fff;
  background:#3A6FD8;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);flex:none;position:relative}
.ptile.b{background:#0F8A7E} .ptile.z{background:#B5651D} .ptile.g{background:#7A7F8C}
.ptile .badge{position:absolute;top:-4px;right:-5px}
.pname{display:flex;flex-direction:column;min-width:0;flex:1;line-height:1.25}
.pname b{font-weight:600;font-size:13.5px}
.pname small{font-size:11.5px;color:var(--ink-3);font-family:var(--font-data)}
.search{display:flex;align-items:center;gap:8px;height:32px;padding:0 8px 0 10px;margin:6px 0 4px;border-radius:var(--r-ctl);
  background:var(--surface);box-shadow:var(--shadow-1);color:var(--ink-3);width:100%;font-size:12.5px}
.search span.t{flex:1}
.nav{display:flex;flex-direction:column;gap:1px;margin-bottom:6px}
.nitem{display:flex;align-items:center;gap:9px;height:28px;padding:0 8px;border-radius:8px;color:var(--ink-2);font-size:12.5px;width:100%}
.nitem:hover{background:var(--hover);color:var(--ink)}
.nitem .kbd{margin-left:auto}
.sh{display:flex;align-items:center;gap:6px;height:28px;padding:0 8px;margin-top:8px;font-size:11.5px;font-weight:500;color:var(--ink-3)}
.sh .grow{flex:1}
.count{font-size:11.5px;font-weight:500;color:var(--ink-3);font-variant-numeric:tabular-nums}
.count.need{color:var(--need-ink)}
.sbody{display:flex;flex-direction:column;gap:1px;min-height:0}
.lanes{flex:1;min-height:0;overflow:auto;scrollbar-width:none;mask-image:linear-gradient(#000 calc(100% - 24px),transparent)}
.lrow{position:relative;display:flex;align-items:center;gap:9px;height:30px;padding:0 8px;border-radius:8px;width:100%;color:var(--ink);font-size:13px;
  transition:background .2s var(--ease)}
.lrow:hover{background:var(--hover)}
.lrow.sel{background:var(--surface);box-shadow:var(--shadow-1)}
:root[data-theme=dark] .lrow.sel{background:var(--hover-2);box-shadow:none}
.lrow .ln{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .lm{font-family:var(--font-data);font-size:11.5px;color:var(--ink-3);white-space:nowrap}
.lrow .lm.warn{color:var(--wait-ink)} .lrow .lm.crit{color:var(--need-ink)}
.lrow.need{background:var(--need-soft);animation:breathe 2.8s ease-in-out infinite}
.lrow.need .lm{color:var(--need-ink)}
.lrow .more{opacity:0;margin-left:2px;color:var(--ink-3);display:grid;place-items:center;width:20px;height:20px;border-radius:6px}
.lrow:hover .more,.lrow.sel .more{opacity:1}
.ask{display:block;width:100%;padding:9px 10px 10px;border-radius:var(--r-card);background:var(--surface);box-shadow:var(--shadow-1);position:relative;overflow:hidden}
.ask::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--need)}
.ask .top{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-2)}
.ask .top b{color:var(--ink);font-weight:600;font-size:13px}
.ask .top .age{margin-left:auto;font-family:var(--font-data);font-size:11.5px;color:var(--need-ink)}
.ask .what{margin-top:4px;font-family:var(--font-data);font-size:12px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.alert{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;font-size:12px;color:var(--ink-2);line-height:1.35;width:100%}
.alert:hover{background:var(--hover)}
.alert svg{color:var(--wait);margin-top:1px}
.alert b{color:var(--ink);font-weight:500}
.alert>span:nth-child(2){flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lost{display:flex;align-items:center;gap:9px;padding:6px 6px 6px 8px;border-radius:8px;border:1px dashed var(--line-2);font-size:12.5px;margin-top:2px}
.lost .ln{flex:1;min-width:0}
.lost small{display:block;color:var(--ink-3);font-size:11.5px;line-height:1.3}
.prow{display:flex;align-items:center;gap:9px;height:30px;padding:0 8px;border-radius:8px;font-size:12.5px;width:100%;color:var(--ink-2)}
.prow:hover{background:var(--hover)}
.prow .ptile{width:18px;height:18px;border-radius:6px;font-size:11px}
.prow .ln{flex:1}
.prow .lm{font-size:11.5px;color:var(--ink-3)}
.prow .lm.warn{color:var(--wait-ink)} .prow .lm.crit{color:var(--need-ink)}
.side-foot{margin-top:auto;padding:8px 4px 0;display:flex;align-items:center;gap:8px;border-top:1px solid var(--line)}
.live{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-2);padding:4px 6px;border-radius:6px}
.live:hover{background:var(--hover)}
.ver{font-family:var(--font-data);font-size:11.5px;color:var(--ink-3);display:inline-flex;align-items:center;gap:5px;padding:4px 6px;border-radius:6px}
.ver:hover{background:var(--hover)}
.seg{display:inline-flex;margin-left:auto;padding:2px;border-radius:8px;background:var(--sunk);box-shadow:inset 0 0 0 1px var(--line)}
.seg button{width:26px;height:22px;display:grid;place-items:center;border-radius:6px;color:var(--ink-3)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-1)}
:root[data-theme=dark] .seg button.on{background:var(--hover-2)}

/* ---- state: dots and chips ---- */
.dot{width:8px;height:8px;border-radius:50%;flex:none;position:relative;background:var(--idle)}
.dot.work{background:var(--work)} .dot.wait{background:var(--wait)} .dot.need{background:var(--need)}
.dot.idle{background:transparent;box-shadow:inset 0 0 0 1.5px var(--idle)}
.dot.lost{background:transparent;border:1.5px dashed var(--ink-3)}
.dot.work::after,.dot.need::after{content:"";position:absolute;inset:0;border-radius:50%;background:inherit;animation:ping 2s var(--ease) infinite}
.dot.need::after{animation-duration:1.4s}
.dot.ok{background:var(--work)} .dot.fail{background:var(--need)}
@keyframes ping{0%{transform:scale(1);opacity:.6}75%,100%{transform:scale(2.7);opacity:0}}
@keyframes breathe{0%,100%{box-shadow:0 0 0 0 transparent}50%{box-shadow:0 0 0 3px var(--need-ring)}}
@keyframes enter{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes forward{from{opacity:.4;transform:scale(.94)}to{opacity:1;transform:none}}
.chip{display:inline-flex;align-items:center;gap:6px;height:20px;padding:0 8px 0 7px;border-radius:999px;font-size:11.5px;font-weight:500;
  background:var(--idle-soft);color:var(--idle-ink);white-space:nowrap;transition:background .2s,color .2s}
.chip .dot{width:6px;height:6px}
.chip.work{background:var(--work-soft);color:var(--work-ink)}
.chip.wait{background:var(--wait-soft);color:var(--wait-ink)}
.chip.need{background:var(--need-soft);color:var(--need-ink)}
.chip.lost{background:transparent;box-shadow:inset 0 0 0 1px var(--line-2);color:var(--ink-2)}
.chip.acc{background:var(--accent-soft);color:var(--accent-ink)}
.chip.plain{background:var(--sunk);color:var(--ink-2)}
.badge{min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--need);color:#fff;font-size:11px;font-weight:600;display:inline-grid;place-items:center;line-height:1}
.tag{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:6px;font-size:11.5px;color:var(--ink-2);background:var(--sunk);white-space:nowrap}
.sample{display:inline-flex;align-items:center;gap:5px;height:18px;padding:0 7px;border-radius:999px;font-size:11px;font-weight:500;color:var(--accent-ink);
  box-shadow:inset 0 0 0 1px var(--accent-soft);background:repeating-linear-gradient(135deg,transparent 0 5px,var(--accent-soft) 5px 6px)}
.kbd{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 5px;border-radius:6px;font:500 11.5px/1 var(--font-ui);color:var(--ink-3);
  background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line-2)}

/* ---- controls ---- */
.btn{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:var(--r-ctl);font-size:12.5px;font-weight:500;
  background:var(--surface);color:var(--ink);box-shadow:var(--shadow-1);white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--ink);color:var(--bg);box-shadow:none}
.btn.ghost{background:transparent;box-shadow:none;color:var(--ink-2)} .btn.ghost:hover{background:var(--hover);color:var(--ink)}
.btn .kbd{height:18px;min-width:18px;background:transparent;box-shadow:inset 0 0 0 1px currentColor;color:inherit;opacity:.6}
.ib{width:28px;height:28px;display:inline-grid;place-items:center;border-radius:var(--r-ctl);color:var(--ink-2)}
.ib:hover{background:var(--hover);color:var(--ink)}
.ib.sm{width:22px;height:22px;border-radius:6px}

/* ---- top bar and its figure strip ---- */
.top{height:52px;flex:none;display:flex;align-items:center;gap:12px;padding:0 2px 0 6px}
.crumb{display:flex;align-items:center;gap:8px;font-size:13px;flex:none;white-space:nowrap}
.crumb .faint{display:inline-flex}
.crumb b{font-weight:600}
.figs{margin-left:auto;display:flex;align-items:stretch;height:34px;border-radius:10px;background:var(--surface);box-shadow:var(--shadow-1);overflow:hidden;flex:none}
.fig{display:flex;align-items:center;gap:7px;padding:0 10px;font-size:12px;color:var(--ink-2);white-space:nowrap;position:relative}
.fig+.fig::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:1px;background:var(--line)}
.fig:hover{background:var(--hover)}
.fig .k{color:var(--ink-3)}
.fig .v{font-family:var(--font-data);font-size:12px;color:var(--ink)}
.fig .v.warn{color:var(--wait-ink)} .fig .v.crit{color:var(--need-ink)}
.mini{width:44px;height:5px;border-radius:999px;background:var(--track);position:relative;overflow:visible}
.mini>i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--ink-2)}
.mini>i.warn{background:var(--wait)} .mini>i.crit{background:var(--need)}
.stack{display:flex;width:52px;height:6px;border-radius:999px;overflow:hidden;gap:2px}
.stack i{display:block;height:100%;border-radius:3px}
.stack .work{background:var(--work)} .stack .need{background:var(--need)} .stack .idle{background:var(--track)}
.econ{display:inline-flex;align-items:center;gap:5px;color:var(--ink)}
.tools{display:flex;align-items:center;gap:6px;flex:none}

/* ---- the terminal (dark in both modes) ---- */
.term{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--term-bg);border-radius:var(--r-pane);box-shadow:var(--shadow-term);overflow:hidden;color:var(--t-ink);position:relative;
  transition:box-shadow .25s var(--ease)}
.term.typing{box-shadow:0 0 0 1.5px var(--accent), 0 0 0 5px var(--accent-soft), var(--shadow-term)}
.term.need{box-shadow:0 0 0 1px var(--need-ring), var(--shadow-term);animation:breatheT 2.8s ease-in-out infinite}
@keyframes breatheT{0%,100%{box-shadow:0 0 0 1px var(--need-ring), var(--shadow-term)}50%{box-shadow:0 0 0 1px var(--need), 0 0 0 5px var(--need-soft), var(--shadow-term)}}
.thead{height:44px;flex:none;display:flex;align-items:center;gap:10px;padding:0 8px 0 14px;background:var(--term-head);border-bottom:1px solid var(--term-line);min-width:0}
.thead .tn{font-weight:600;font-size:13px;color:#F1F2F4;white-space:nowrap}
.thead .br{font-family:var(--font-data);font-size:12px;color:var(--t-mid);white-space:nowrap;flex:none}
.thead .tts{display:flex;gap:6px;min-width:0;flex:0 1 auto;overflow:hidden}
.thead .tts .tt[hidden]{display:none}
.thead .tt{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:6px;font-size:11.5px;color:var(--t-mid);background:rgba(255,255,255,.055);white-space:nowrap}
.thead .grow{flex:1}
.thead .hint{font-size:12px;color:var(--t-dim);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.thead .hint .kbd{background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);color:var(--t-mid)}
.thead .hint.typing{color:var(--accent-ink)}
.thead .ib{color:var(--t-mid)} .thead .ib:hover{background:rgba(255,255,255,.07);color:#fff}
.thead .tbtn{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 9px;border-radius:8px;font-size:12px;color:var(--t-ink);background:rgba(255,255,255,.06);white-space:nowrap}
.thead .tbtn:hover{background:rgba(255,255,255,.1)}
.thead .tbtn .kbd{height:16px;min-width:16px;font-size:11px;background:transparent;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);color:var(--t-mid)}
.thead .chip.work{background:rgba(60,214,138,.12);color:#5BE2A0}
.thead .chip.need{background:rgba(255,97,104,.14);color:#FF8A8F}
.thead .chip.idle{background:rgba(255,255,255,.07);color:#A2A5AF}
.thead .dot.idle{box-shadow:inset 0 0 0 1.5px #6E717C}
.tbody{flex:1;min-height:0;overflow:hidden;padding:14px 18px;font:400 12.5px/1.52 var(--font-term);white-space:pre;font-variant-numeric:normal;
  -webkit-font-smoothing:auto;position:relative}
.tbody.bottom{display:flex;flex-direction:column;justify-content:flex-end}
.tfoot{flex:none;display:flex;align-items:center;gap:10px;height:32px;padding:0 14px;border-top:1px solid var(--term-line);font-size:12px;color:var(--t-dim);background:var(--term-head)}

    <div class="tl ${st(l) === "wait" ? "pend" : "faint"}">${st(l) === "wait" ? esc(activity(l)) : esc(pr ? (l.readiness.rows.every(r => r.ok || r.unknown) ? "Approved, checks green" : l.readiness.reasons[0]) : l.readiness ? l.readiness.reasons[0] : "on " + l.branch)}</div></button>`;
}
function spotlight() {
  const n = A.needsYou[0], l = lane(n.name), t = termText(l).split("\n"), i = t.findIndex(x => /⎿/.test(x));
  return `<div class="spot">
    <div class="sl"><h2><span class="dot need"></span>${esc(l.name)}${chip("need")}</h2>
      <div class="tb2 mono faint">${esc(l.branch)}</div>
      <div class="q">Asks for ${esc(n.label.toLowerCase())} to run <code>${esc(n.text)}</code>, ${ago(NOW - n.at)} ago.</div>
      <div class="why">${l.readiness ? esc(l.readiness.reasons.join(", ")) : ""}</div>
      <div class="acts"><button class="btn primary" data-act="open" data-arg="${esc(l.name)}">${I("term", "s")}Open terminal<span class="kbd">↵</span></button><button class="btn" data-act="open" data-arg="${esc(l.name)}">Show lane</button></div></div>
    <div class="prev" data-act="open" data-arg="${esc(l.name)}">${prevHTML(t.slice(i))}</div>
  </div>`;
}
function film(sel) {
  return `<div class="film">${LANES.map(l => { const s = st(l); return `<button class="ft${l.name === sel ? " sel" : ""}${s === "need" && l.name !== sel ? " need" : ""}" data-act="open" data-arg="${esc(l.name)}"><span class="dot ${s}"></span>${esc(l.name)}${sampleTag(l)}${laneMeta(l).replace('class="lm', 'class="lm')}</button>`; }).join("")}</div>`;
}
const V = {
  title: "Hybrid",
  pitch: "The owner's mix: Overview first's home of lane tiles, and a lane opened as Stage draws it: the terminal as the main pane, its three boxes beneath, Pulse at the right.",
  openRules: 3,
  current: () => lane(S.lane) || lane("waiting"),
  render() {
    if (S.view === "lane") {
      const l = V.current();
      const crumb = `<div class="crumb"><button class="btn ghost" data-act="home" title="All lanes (Esc)" style="padding:0 8px 0 4px">${I("left", "s")}All lanes</button><span class="faint">${I("right", "s")}</span><b>${esc(l.name)}</b>${sampleTag(l)}${chip(st(l))}</div>`;
      return sidebar({ sel: l.name }) + `<div class="main">${topbar(crumb, { lanes: false })}
        <div class="body lanev${FOLD.pulse ? " nopulse" : ""}"><div class="lanecol">${film(l.name)}
        <div class="center">${termPane(l, { foot: st(l) === "need" ? `<div class="tfoot"><span style="color:var(--need-ink)">Answer in the terminal: 1 Yes, 2 Yes and don't ask again, 3 No</span><span style="flex:1"></span><span class="num">tmux ux-p45-1</span></div>` : undefined })}
          ${FOLD.boxes ? "" : `<div class="strip">${secContext(l)}${secPR(l)}${secRun(l)}</div>`}</div></div>
        ${FOLD.pulse ? "" : pulse()}</div></div>`;
    }
    const work = LANES.filter(l => st(l) === "work"), wait = LANES.filter(l => st(l) === "wait"), idle = LANES.filter(l => st(l) === "idle");
    const crumb = `<div class="crumb"><span class="faint">${esc(A.name)}</span><span class="faint">${I("right", "s")}</span><b>All lanes</b></div>`;
    return sidebar({ sel: "" }) + `<div class="main">${topbar(crumb, { lanes: false })}
      <div class="body"><div class="home">
        <div class="hh"><h1>${esc(A.name)}</h1><span class="faint">${counts.work} working, ${counts.need} needs you, ${counts.wait} waiting, ${counts.idle} idle, 1 lost</span></div>
        <div class="gl"><span class="dot need"></span>Needs you<span class="count">1</span></div>${spotlight()}
        <div class="gl"><span class="dot work"></span>Working<span class="count">${work.length}</span></div><div class="tiles">${work.map(tile).join("")}</div>
        <div class="gl"><span class="dot wait"></span>Waiting<span class="count">${wait.length}</span><span class="dot idle" style="margin-left:8px"></span>Idle<span class="count">${idle.length}</span></div><div class="tiles idle">${wait.concat(idle).map(compactTile).join("")}
          <button class="tile compact lostt"><div class="th"><span class="dot lost"></span><b>${esc(A.orphan.name)}</b><span class="btn" style="height:22px;font-size:11.5px">Restore</span></div><div class="tl faint">Lost: its tmux session is gone</div></button>
          <button class="tile ghost" data-act="palette">${I("plus", "s")}New lane</button></div>
      </div>${pulse()}</div></div>`;
  },
  act(act, arg) {
    if ((act === "open" || act === "lane") && lane(arg)) { S.view = "lane"; S.lane = arg; S.screen = "lane"; return true; }
    if (act === "home") { S.view = "home"; S.screen = "lane"; return true; }
    return false;
  },
  escape() { if (S.view === "lane") { S.view = "home"; return true; } return false; },
  rules: [
    { h: "Density", items: [
      "<b>Figures in the top bar:</b> the same strip as every variant. The lanes figure leaves it on home and in a lane: the tiles and the filmstrip are the count.",
      "<b>Home</b> is Overview first's: tiles grouped by state, the lane that needs you as a wide spotlight with its terminal, working lanes as tiles with a four-line preview, waiting and idle lanes as compact tiles, the lost lane and New lane last.",
      "<b>A lane opened</b> is Stage's: the filmstrip of every live lane on top (the lost lane stays in the sidebar and on home, with Restore), the terminal beneath it, and one row of three boxes under the terminal: Context (with the top contributors), Pull request (readiness, checks, diff) and Run (cost against budget, agents, time). No tabs.",
      "<b>Pulse keeps its column at the right in both views:</b> routines, Today, the next 14 days, Flow and the pinned cards.",
      HEADER_RULE,
    ] },
    { h: "When the terminal shows, grows, shrinks or hides", items: [
      "<b>On home the only terminal is the asking lane's,</b> ready in the spotlight with the ask in view. Working tiles show their last four lines as text previews, not terminals; waiting and idle tiles show none.",
      "<b>Opened, the terminal is the stage:</b> the largest pane, between the filmstrip and the three boxes, which never share its row. Opening a lane (a click, ↵ on a tile, or ⌘K) brings it forward from 94% in 260 ms.",
      "<b>It grows</b> when the boxes fold (⌘J) or Pulse folds (⌘.); the same key unfolds them. Below 1440 px wide Pulse folds by itself, and below 800 px high the boxes do.",
      "<b>Sizes:</b> from 1700 px wide the sidebar widens to 268 px and Pulse to 340 px; below 960 px high Context lists four contributors, not five.",
      "<b>Back home:</b> Esc, All lanes in the crumb, or a tile in the filmstrip opens that lane instead.",
      "<b>A lane that needs you surfaces itself.</b> On home it takes the spotlight with its terminal ready. In another lane it is not opened for you: its filmstrip tile breathes red and it leads Needs you.",
    ] },
  ],
  tells: ["Home holds one terminal at most, the asking lane's; a working tile's preview is drawn from the pane's last lines.", "In a lane, the terminal is the stage's first track and has no rule that sets its width to zero."],
  links: [["view=home&screen=lane", "Home"], ["view=lane&screen=lane", "The asking lane opened"], ["view=lane&lane=working&screen=lane", "A working lane opened"], ["screen=menu", "Project menu"], ["screen=palette", "⌘K open"], ["mode=light", "Light"], ["mode=dark", "Dark"]],
};
mount();
</script>
