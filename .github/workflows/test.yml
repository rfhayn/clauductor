# The full suite, on every push to main and every pull request into it: `go test
# -short` is for working locally; this is what enforces everything else (docs/panel.md,
# Testing). Actions are pinned to commit SHAs; no secrets.
name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    # internal/plugin alone takes ~500 s under -race on macOS runners, near go test's 10-minute
    # per-package default; the job ran 19m17s against a 20-minute limit (OPS-19).
    timeout-minutes: 40
    defaults:
      run:
        working-directory: framework
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: framework/go.mod
          cache-dependency-path: framework/go.sum
      - name: Install tmux
        run: |
          if [ "$RUNNER_OS" = macOS ]; then brew install tmux; else sudo apt-get update && sudo apt-get install -y tmux; fi
          tmux -V
      # The template's OpenSpec check validates its example change through the module's symlinks
      # (template/.claude/checks/openspec.sh); OPENSPEC_REQUIRED makes a missing CLI a failure
      # here, where it is installed. Pinned: the version the module was tested against.
      - name: Install the OpenSpec CLI
        run: npm install -g @fission-ai/openspec@1.13.2 && openspec --version
        env:
          DO_NOT_TRACK: "1"
          OPENSPEC_TELEMETRY: "0"
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race ./...
        env:
          OPENSPEC_REQUIRED: "1"
          NODE_REQUIRED: "1"
      # This repo runs the operating model it ships (OPS-8): its own process checks, over its own
      # records, hooks and roles, the no-clauductor check included (no clauductor is installed here).
      - name: process checks (this repo's operating model)
        working-directory: .
        run: sh .claude/checks/run.sh
        env:
          OPENSPEC_REQUIRED: "1"
          NODE_REQUIRED: "1"
