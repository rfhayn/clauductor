# The scheduled dependency audit: every week, the production dependencies of each ecosystem this
# repository has, against the public advisory databases. It FAILS on an advisory of high severity or
# worse. A scheduled run reaches no PR, so its reader is session-start's health block
# (.claude/health/dependency-audit.sh). Each step runs only when its manifest exists.
name: dependency-audit

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: npm
        if: hashFiles('package-lock.json') != ''
        run: npm audit --omit=dev --audit-level=high
      - name: pnpm
        if: hashFiles('pnpm-lock.yaml') != ''
        run: corepack enable && pnpm audit --prod --audit-level high
      - name: Go
        if: hashFiles('go.mod') != ''
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Python
        if: hashFiles('requirements.txt') != ''
        run: pipx run pip-audit -r requirements.txt
      - name: nothing to audit
        if: hashFiles('package-lock.json', 'pnpm-lock.yaml', 'go.mod', 'requirements.txt') == ''
        run: echo "no dependency manifest (package-lock.json, pnpm-lock.yaml, go.mod, requirements.txt) in this repository"
