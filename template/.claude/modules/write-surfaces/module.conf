# module.conf: the write-surface advisory (.claude/modules/README.md has the interface).
# Lowercase keys describe the module; UPPERCASE keys are defaults for .claude/project.conf,
# applied only where the project sets nothing. Needs git only.
name="write-surfaces"
requires=""
enables="guard.d checks"
# What counts as a write surface: space-separated shell patterns (`case` patterns, so * matches /)
# for a file whose ADDITION adds one: a route, a screen, a handler. No default fits every project,
# so checks/project.sh fails while it is empty.
WRITE_SURFACE_GLOBS=""
# The advisory fires at this many added surfaces or more.
WRITE_SURFACE_MAX="4"
