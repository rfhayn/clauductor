# module.conf: the OpenSpec module (.claude/modules/README.md has the interface).
# Lowercase keys describe the module; UPPERCASE keys are defaults for .claude/project.conf,
# applied only where the project sets nothing. Enabling it sets PROPOSALS="openspec".
name="openspec"
requires=""
enables="checks skills"
# The CLI the checks run: 1.13 or later (enable.sh refuses an older one by name).
OPENSPEC_BIN="openspec"
