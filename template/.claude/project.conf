# project.conf: the project-specific values the operating model's scripts read.
#
# Plain `KEY="value"` lines, sourced by sh (.claude/lib/conf.sh), so a script in any language
# can read it without a parser. Every key has a default in conf.sh; set only what differs.
# `/start-project` walks through these with you.
#
# This is the ONE place a script's paths and names come from. A value typed into a script
# instead drifts the first time you rename something.

# ── Identity ────────────────────────────────────────────────────────────────────────────
PROJECT_NAME="My Project"      # the status line's fallback text, and the playbook's title
PROJECT_SLUG="myproject"       # [a-z0-9-]; names the per-branch focus files
STATUS_MARK="◆"                # the status line's leading mark; tells parallel repos apart

# ── Who decides ─────────────────────────────────────────────────────────────────────────
# The person who approves proposals, designs, ADRs and anything irreversible (AGENTS.md,
# "Who decides"). OWNER_ROLE is the word the skills use for them; OWNER_NAME is how a
# notification addresses them.
OWNER_ROLE="owner"
OWNER_NAME=""

# ── Branches ────────────────────────────────────────────────────────────────────────────
MAIN_BRANCH="main"
BRANCH_CHANGE="change/"        # a capability change: one approved proposal, one PR
BRANCH_FIX="fix/"              # fix/<issue>-<slug>
BRANCH_OPS="ops/"              # tooling, docs, process; also the session-close PR

# ── Records ─────────────────────────────────────────────────────────────────────────────
JOURNAL="docs/development-journal.md"
INSIGHTS="docs/insights-log.md"
ROADMAP="docs/roadmap.md"
OWNER_QUEUE="docs/owner-queue.md"
ADR_DIR="docs/adr"
# The change queue's parser. Empty = the template's .claude/roadmap-queue.sh, for the grammar
# docs/roadmap.md states. A project whose roadmap has its own grammar names its own parser here, a
# command run from the repo root with the mode appended (e.g. "node infra/roadmap-queue.mjs"); every
# reader follows it (roadmap_queue in .claude/lib/conf.sh). ROADMAP_NORMALIZER, optional, is a filter
# from that parser's --tsv to the contract's columns (e.g. its own status words to the four states).
# The contract: docs/roadmap.md, "Plugging in your own parser".
ROADMAP_PARSER=""
ROADMAP_NORMALIZER=""
# The journal heading every session entry since adoption must match (an extended regex).
JOURNAL_HEADING='^## Session [0-9]+(\.[0-9]+)* — [0-9]{4}-[0-9]{2}-[0-9]{2}[^ ]* — [^ ].* — .+'
# The heading the insights log's `| Date | … | Status |` table sits under. compound.sh reads that
# table only, and says CANNOT CHECK when the heading or the table is not there.
INSIGHTS_TABLE_HEADING="## Log"
# Adopting the operating model in a project with history: existing records are never reformatted.
# RECORDS_BASELINE is the adoption point, a YYYY-MM-DD date or a git ref (a tag on the adoption
# commit). Journal headings, ADRs and changes from before it are accepted in their old format; every
# record added since is held to this one (.claude/lib/records.sh). "" = judge every record.
RECORDS_BASELINE=""
# Open changes proposed before adoption, whose format checks/changes.sh does not judge: their ids
# ("add-a add-b"), or "baseline" for every open change created before RECORDS_BASELINE.
CHANGES_LEGACY=""
# The coarse buckets an insights-log row's Area column uses, e.g. "API DB UI Auth Ops Tooling".
INSIGHT_AREAS=""
# The compound step (session-close 3b): an insight may stay Raw for fewer than this many journal
# sessions; checks/compound.sh fails one that waited longer without a decision.
COMPOUND_MAX_SESSIONS="3"

# ── Changes ─────────────────────────────────────────────────────────────────────────────
# PROPOSALS: "markdown" (changes/<id>/{proposal,design,tasks}.md, the core) or "openspec"
# (the optional module in .claude/modules/openspec). REVIEW_PAGE: "none" (the owner reads
# design.md) or "artifact" (the optional claude.ai review page, .claude/modules/review-page).
PROPOSALS="markdown"
CHANGES_DIR="changes"
SPECS_DIR="specs"
REVIEW_PAGE="none"
# Every scenario is `#### Scenario: [CAP-n-Sn] title` (changes/README.md). "required": every
# scenario in the living specs and the deltas carries an ID. "new-only": the living specs may keep
# scenarios written before IDs existed; a delta's scenarios still need one (an adopting project).
SCENARIO_IDS="required"
# Where the tests are, for .claude/scenario-trace.sh: a scenario a change adds or modifies must be
# cited by at least one of these files. `dir/` = a directory of that name at any depth; a pattern
# with no `/` = a file name at any depth; anything else = a path glob from the root. The default
# covers Go (*_test.go), JS/TS (*.test.*, *.spec.*), Python (test_*.py, *_test.py) and the usual
# test directories. Narrow it if a directory of that name is not tests in your project.
TEST_GLOBS="*_test.go *.test.* *.spec.* test_*.py *_test.py tests/ test/ __tests__/ spec/"

# ── Gate ────────────────────────────────────────────────────────────────────────────────
# GATE_RUN is the full gate: it takes the machine-wide lease, runs every step and, only after
# a complete clean run, writes the receipt pr-merge-guard reads. GATE is the agent-facing
# wrapper around it (same flags, same exit code, filtered output). GATE_STEPS is where YOUR
# lint, typecheck and test commands go.
GATE_RUN="scripts/ci/run-local.sh"
GATE="scripts/ci/gate.sh"
GATE_STEPS="scripts/ci/steps.sh"
# "none": the steps run in this checkout, and the receipt is `clean` only for an unchanged tree.
# "archive": the steps run in a temp dir holding `git archive <sha>` (tracked files only).
GATE_CLEAN_ROOM="none"
# The remote CI workflow whose success on the head SHA counts as evidence too ("" = none).
GATE_REMOTE_WORKFLOW=""
# Commit statuses posted only to DRAW a result on the PR; the merge guard ignores them both ways.
GATE_DISPLAY_CONTEXTS=""
# The failure lines gate.sh shows an agent (extended regex). Empty = the generic default.
GATE_FAIL_PATTERN=""

# ── machine-quiet (session-close) ───────────────────────────────────────────────────────
# Orphan shapes it may kill: space-separated shell globs over a process's command line, @WT@ being
# .claude/worktrees. It never kills tmux, claude or clauductor whatever you list. MQ_DOCKER=1
# removes agent compose stacks; MQ_COLIMA=1 stops colima when no gate runs.
MQ_ORPHAN_SHAPES="*@WT@/*/.claude/hooks/*"
MQ_DOCKER="0"
MQ_COLIMA="0"

# ── Formatter ───────────────────────────────────────────────────────────────────────────
# Run on each file Claude writes (.claude/hooks/format.sh). Empty FORMAT_CMD = off.
# Examples: FORMAT_CMD="gofmt -w" FORMAT_EXT="go"; FORMAT_CMD="npx --no-install prettier --write"
# FORMAT_EXT="ts tsx js json css md"; FORMAT_CMD="ruff format" FORMAT_EXT="py".
FORMAT_CMD=""
FORMAT_EXT=""
