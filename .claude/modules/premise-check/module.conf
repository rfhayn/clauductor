# module.conf: the premise check (.claude/modules/README.md has the interface).
# Lowercase keys describe the module; UPPERCASE keys are defaults for .claude/project.conf,
# applied only where the project sets nothing. Needs git and jq; gh to read issues and PRs.
name="premise-check"
requires=""
enables="guard.d checks"
# Branch prefixes whose PRs need a premise-check receipt per issue they fix (space-separated).
PREMISE_REQUIRED_ON="fix/"
# Directories whose files are docs, not code: their hits and commits rank after code's.
PREMISE_DOC_DIRS="docs openspec"
