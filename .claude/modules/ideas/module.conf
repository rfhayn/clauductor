# module.conf: the ideas module (.claude/modules/README.md has the interface). A shared queue of
# ideas on a claude.ai page whose database is the one place an idea is written; `/ideas` adds one
# from Claude Code, and session-close renders the queue into the repository as IDEAS_FILE.
name="ideas"
requires="artifacts"
enables="context.d checks skills conflicts.tsv"
# The rendered queue: generated by bin/render.sh at every close, never edited by hand.
IDEAS_FILE="docs/ideas.md"
# The Ideas page's source, and its key in ARTIFACT_REGISTRY's "pages" (where its url lives).
IDEAS_PAGE="docs/ideas.html"
