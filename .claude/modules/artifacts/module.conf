# module.conf: the artifacts module (.claude/modules/README.md has the interface). Shared pages and
# walkthroughs registered in ARTIFACT_REGISTRY, each held current with the sources it declares;
# optionally, their claude.ai copies published and kept in step with main.
name="artifacts"
requires=""
enables="guard.d context.d health checks skills conflicts.tsv"
# The registry: every artifact, its url, its authorities and its review stamp.
ARTIFACT_REGISTRY="docs/artifacts.json"
# The guard rule's budget for the currency check on a close PR's head, in seconds. It runs inside
# the extension loop's GUARD_RULE_TIMEOUT (60), and a check that overruns blocks.
ARTIFACT_RULE_SECONDS="40"
# claude.ai: the docs/*.html pages have claude.ai copies that sessions republish, record and open
# (Node prepares each copy; the Artifact tool publishes it). off: currency only, no Node.
ARTIFACT_PUBLISH="off"
