# module.conf: the people module (.claude/modules/README.md has the interface).
# Lowercase keys describe the module; UPPERCASE keys are defaults for .claude/project.conf,
# applied only where the project sets nothing.
name="people"
requires=""
enables="context.d checks skills conflicts.tsv roadmap.d"
# The people registry: each person's name (what the roadmap's **Owner:** lines say), GitHub login
# and role, and the lanes. people.example.json in this directory is the shape.
PEOPLE="docs/people.json"
# "required": every roadmap owner must be a person in PEOPLE, or the queue is UNKNOWN
# (roadmap.d/owners.sh). "off" keeps the rest of the module without that rule.
PEOPLE_OWNERS="required"
