<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clauductor Panel</title>
<link rel="icon" href="data:,">
<!-- The CSP allows only this origin: no inline script or style, no CDN. xterm.js and
     the fonts are vendored into the binary. xterm adds style elements at run time;
     panel.js gives each one this per-response nonce, the only inline style allowed. -->
<meta name="csp-style-nonce" content="{{STYLE_NONCE}}">
<!-- First, and synchronous: sets data-theme and data-mode on <html> before the first
     paint, so a stored theme never flashes the default. -->
<script src="/static/theme.js"></script>
<link rel="stylesheet" href="/static/themes.css">
<link rel="stylesheet" href="/static/panel.css">
<link rel="stylesheet" href="/vendor/xterm/xterm.css">
<script src="/vendor/xterm/xterm.js"></script>
<script src="/vendor/addon-fit/addon-fit.js"></script>
</head>
<body>
<header class="mbar">
  <div class="brand"><span id="pname">…</span> <span>/ CONTROL</span></div>
  <span class="live dead" id="live">CONNECTING</span>
  <div class="sp"></div>
  <div class="gauges">
    <div class="gauge" id="g5" title="5-hour quota, from the status line">5 h <span class="track"><span class="fill"></span></span> <b>—</b></div>
    <div class="gauge" id="g7" title="7-day quota, from the status line">7 d <span class="track"><span class="fill"></span></span> <b>—</b></div>
    <div class="gauge" title="Sum of the status line's total_cost_usd over the sessions tracked now: live ones, and ones heard from in the last 30 min. A list-price estimate, not a bill.">est. $<span class="wide"> · tracked sessions</span> (list price) <b id="cost">—</b></div>
    <div class="gauge hooks" title="Hook events accepted / status-line posts / events dropped (cwd outside the project). The footer has the full counters.">hooks <b id="hookn">0</b></div>
  </div>
  <button class="btn primary" id="addlane" type="button" title="Start a lane: an interactive claude in its own tmux session">+ LANE</button>
  <button class="btn" id="refresh" type="button" title="Re-poll every source now">↻ REFRESH</button>
  <div class="picker">
    <button class="btn pickbtn" id="themebtn" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="thememenu" title="Theme and light or dark mode"><span class="sw" aria-hidden="true"><b>Aa</b><i></i><i></i><i></i><i></i></span><span id="themename">THEME</span></button>
    <div class="menu" id="thememenu" role="menu" aria-label="Theme and mode" hidden></div>
  </div>
</header>
<div class="band" aria-hidden="true"></div>
<div class="banners" id="banners"></div>
<div class="banners" id="restorebar" hidden></div>
<main class="mgrid">
  <section class="mcol" id="left"></section>
  <section class="mcol" id="centre">
    <div class="tabs" id="tabs"></div>
    <div class="termhost" id="termhost"><div class="empty" id="termempty"></div><div class="empty" id="termorphan" hidden></div></div>
    <div class="termbar" id="termbar"></div>
    <div class="detail" id="detail"></div>
  </section>
  <section class="mcol" id="right"></section>
</main>
<footer class="obs" id="obs"></footer>
<div class="modal" id="startdlg" hidden>
  <form class="dlg" id="startform" autocomplete="off">
    <h3>Start a lane</h3>
    <div class="sub">An interactive claude in its own tmux session. It keeps running when you close this page.</div>
    <label>Template <select id="st-tpl"></select></label>
    <label>Lane type <select id="st-type"></select></label>
    <fieldset>
      <legend>Where it runs</legend>
      <label class="inline"><input type="radio" name="st-mode" value="new" checked> New branch and worktree</label>
      <label class="inline"><input type="radio" name="st-mode" value="existing"> An existing worktree</label>
      <label class="inline"><input type="radio" name="st-mode" value="root"> The project root</label>
    </fieldset>
    <label id="st-wt-row">Worktree <select id="st-wt"></select></label>
    <label>Lane name <input type="text" id="st-name" maxlength="41" spellcheck="false" placeholder="e.g. add-login"></label>
    <label id="st-issue-row" hidden>Issue <input type="text" id="st-issue" maxlength="200" spellcheck="false" placeholder="e.g. #412"></label>
    <div class="sub" id="st-prompt" hidden></div>
    <label class="inline" id="st-quota-row" hidden><input type="checkbox" id="st-quota"> <span id="st-quota-why"></span></label>
    <div class="sub" id="st-preview"></div>
    <div class="card err" id="st-block" hidden></div>
    <div class="stop" id="st-err"></div>
    <div class="actions">
      <button type="button" class="btn" id="st-cancel">CANCEL</button>
      <button type="submit" class="btn primary" id="st-go">START LANE</button>
    </div>
  </form>
</div>
<script src="/static/panel.js"></script>
</body>
</html>
