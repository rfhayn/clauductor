<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clauductor Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Dark-first console. Tokens are the approved review page's, verbatim. */
:root {
  --ink: #0d1424; --panel: #131d33; --panel-2: #1a2743; --line: #2a3b60; --line-strong: #3d5485;
  --text: #e7edf8; --text-dim: #9aa9c6; --signal: #4cc3ff; --signal-ink: #04121f; --signal-soft: rgba(76,195,255,.14);
  --go: #3ddc97; --go-soft: rgba(61,220,151,.14); --hold: #ffb020; --hold-soft: rgba(255,176,32,.14);
  --stop: #ff5d6c; --stop-soft: rgba(255,93,108,.16); --grid: rgba(76,195,255,.045); --term: #070b14; --term-text: #c9d6ee;
  --r: 4px;
  --font-display: "Chakra Petch", "Segoe UI", ui-sans-serif, system-ui, sans-serif;
  --font-body: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --ink: #edf1f7; --panel: #ffffff; --panel-2: #f3f6fb; --line: #cbd5e5; --line-strong: #9fb0cc;
  --text: #0f1a2e; --text-dim: #4e5d78; --signal: #0063b5; --signal-ink: #ffffff; --signal-soft: rgba(0,99,181,.10);
  --go: #0b7a4f; --go-soft: rgba(11,122,79,.10); --hold: #8a5a00; --hold-soft: rgba(196,132,0,.14);
  --stop: #c1253a; --stop-soft: rgba(193,37,58,.10); --grid: rgba(0,99,181,.05); --term: #0f1a2e; --term-text: #dfe7f5;
  color-scheme: light; } }
:root[data-theme="light"] {
  --ink: #edf1f7; --panel: #ffffff; --panel-2: #f3f6fb; --line: #cbd5e5; --line-strong: #9fb0cc;
  --text: #0f1a2e; --text-dim: #4e5d78; --signal: #0063b5; --signal-ink: #ffffff; --signal-soft: rgba(0,99,181,.10);
  --go: #0b7a4f; --go-soft: rgba(11,122,79,.10); --hold: #8a5a00; --hold-soft: rgba(196,132,0,.14);
  --stop: #c1253a; --stop-soft: rgba(193,37,58,.10); --grid: rgba(0,99,181,.05); --term: #0f1a2e; --term-text: #dfe7f5;
  color-scheme: light; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--ink); color: var(--text); font: 14px/1.5 var(--font-body);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px; display: flex; flex-direction: column; }
code, .mono { font-family: var(--font-mono); font-size: .84em; }
.mbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
.brand { font: 700 1rem/1 var(--font-display); letter-spacing: .06em; text-transform: uppercase; }
.brand span { color: var(--signal); }
.sp { flex: 1; }
.gauge { display: flex; align-items: center; gap: 6px; font: 500 .72rem/1 var(--font-mono); color: var(--text-dim); white-space: nowrap; }
.gauge .track { width: 70px; height: 6px; background: var(--panel-2); border-radius: 3px; overflow: hidden; }
.gauge .fill { display: block; height: 100%; width: 0; background: var(--go); }
.gauge .fill.h { background: var(--hold); } .gauge .fill.s { background: var(--stop); }
.gauge b { color: var(--text); font-weight: 600; }
.live { font: 600 .7rem/1 var(--font-mono); color: var(--go); letter-spacing: .1em; }
.live::before { content: "● "; }
.live.dead { color: var(--stop); }
.btn { font: 600 .68rem/1 var(--font-mono); letter-spacing: .06em; padding: 6px 8px; border-radius: 3px; border: 1px solid var(--line-strong); color: var(--text); background: var(--panel-2); cursor: pointer; }
.btn:hover { border-color: var(--signal); }
.banners { display: grid; gap: 0; }
.banner { background: var(--stop-soft); border-bottom: 1px solid var(--stop); color: var(--text); padding: 8px 16px; font-size: .85rem; }
.banner b { color: var(--stop); font-family: var(--font-mono); font-size: .72rem; letter-spacing: .1em; margin-right: 8px; }
.mgrid { flex: 1; display: grid; grid-template-columns: 18rem minmax(0, 1fr) 20rem; min-height: 0; }
@media (max-width: 980px) { .mgrid { grid-template-columns: 1fr; } }
.mcol { padding: 12px; border-right: 1px solid var(--line); min-width: 0; display: grid; align-content: start; gap: 8px; overflow-y: auto; }
.mcol:last-child { border-right: 0; }
.mh { font: 600 .66rem/1 var(--font-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--text-dim); margin: 8px 0 2px; }
.mh:first-child { margin-top: 4px; }
.lane { border: 1px solid var(--line); border-left: 3px solid var(--line-strong); border-radius: var(--r); background: var(--panel); padding: 8px 10px; display: grid; gap: 4px; font-size: .82rem; cursor: pointer; }
.lane.busy { border-left-color: var(--go); } .lane.waiting { border-left-color: var(--hold); } .lane.idle, .lane.none { border-left-color: var(--line-strong); }
.lane.stale { border-left-color: var(--stop); }
.lane.sel { outline: 1px solid var(--signal); }
.lane.quiet { opacity: .7; padding: 6px 10px; }
.row { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.nm { font: 600 .8rem/1.2 var(--font-mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kind { font: 600 .6rem/1 var(--font-mono); letter-spacing: .1em; text-transform: uppercase; padding: 3px 5px; border-radius: 2px; background: var(--panel-2); color: var(--text-dim); white-space: nowrap; }
.sub { color: var(--text-dim); font-size: .75rem; font-family: var(--font-mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ctx { height: 4px; background: var(--panel-2); border-radius: 2px; overflow: hidden; }
.ctx i { display: block; height: 100%; background: var(--signal); }
.card { border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); padding: 8px 10px; font-size: .8rem; display: grid; gap: 4px; min-width: 0; overflow-wrap: anywhere; }
.card.ask { border-color: var(--hold); background: var(--hold-soft); }
.card.err { border-color: var(--stop); background: var(--stop-soft); }
.card ul { margin: 0; padding-left: 1.1rem; display: grid; gap: 2px; }
.card .kv { display: grid; grid-template-columns: max-content 1fr; gap: 2px 8px; }
.dim { color: var(--text-dim); }
.go { color: var(--go); } .hold { color: var(--hold); } .stop { color: var(--stop); }
.feed { display: grid; gap: 4px; font-size: .76rem; }
.ev { display: grid; grid-template-columns: 3.2rem 1fr; gap: 6px; font-family: var(--font-mono); min-width: 0; }
.ev .t { color: var(--text-dim); }
.ev .d { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ev .d .dim { margin-left: 4px; }
.summary { border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--panel); padding: 12px 14px; display: grid; gap: 10px; }
.summary h2 { font: 700 1.2rem/1.15 var(--font-display); letter-spacing: .02em; margin: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 500 .7rem/1 var(--font-mono); padding: 4px 7px; border-radius: 999px; border: 1px solid var(--line-strong); color: var(--text-dim); white-space: nowrap; }
.chip.go { color: var(--go); background: var(--go-soft); border-color: transparent; }
.chip.hold { color: var(--hold); background: var(--hold-soft); border-color: transparent; }
.chip.stop { color: var(--stop); background: var(--stop-soft); border-color: transparent; }
.chip.sig { color: var(--signal); background: var(--signal-soft); border-color: transparent; }
table { border-collapse: collapse; width: 100%; font-size: .78rem; }
th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); font-family: var(--font-mono); white-space: nowrap; }
th { font-size: .62rem; letter-spacing: .1em; text-transform: uppercase; color: var(--text-dim); background: var(--panel-2); }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); }
.empty { color: var(--text-dim); font-size: .8rem; font-style: italic; }
</style>
</head>
<body>
<header class="mbar">
  <div class="brand"><span id="pname">…</span> <span>/ CONTROL</span></div>
  <span class="live dead" id="live">CONNECTING</span>
  <div class="sp"></div>
  <div class="gauge" id="g5" title="5-hour quota, from the status line">5 h quota <span class="track"><span class="fill"></span></span> <b>—</b></div>
  <div class="gauge" id="g7" title="7-day quota, from the status line">7 d quota <span class="track"><span class="fill"></span></span> <b>—</b></div>
  <div class="gauge" title="Sum of the status line's total_cost_usd for sessions seen by this panel run. A list-price estimate, not a bill.">est. $ (list price) <b id="cost">—</b></div>
  <div class="gauge" title="Hook events accepted / status-line posts / events dropped (cwd outside the project)">hooks <b id="hookn">0</b></div>
  <button class="btn" id="refresh" type="button" title="Re-poll every source now">↻ REFRESH</button>
</header>
<div class="banners" id="banners"></div>
<main class="mgrid">
  <section class="mcol" id="left"></section>
  <section class="mcol" id="centre"></section>
  <section class="mcol" id="right"></section>
</main>
<script>
"use strict";
// Every piece of text from the server goes through textContent: prompts, card output
// and PR titles are data, never markup.
let S = null, offset = 0, es = null, selected = null;
try { selected = localStorage.getItem("clauductor-panel-lane"); } catch (e) {}

function el(tag, cls, text, kids) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  for (const k of kids || []) if (k) e.appendChild(k);
  return e;
}
const $ = (id) => document.getElementById(id);
const now = () => Date.now() - offset;
function age(ms) {
  if (!ms) return "—";
  const s = Math.max(0, Math.round((now() - ms) / 1000));
  if (s < 60) return s + "s";
  if (s < 3600) return Math.floor(s / 60) + "m";
  if (s < 86400) return Math.floor(s / 3600) + "h" + String(Math.floor((s % 3600) / 60)).padStart(2, "0");
  return Math.floor(s / 86400) + "d";
}
function hhmm(ms) { const d = new Date(ms); return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0") + ":" + String(d.getSeconds()).padStart(2, "0"); }
function pct(v) { return v == null ? "—" : Math.round(v) + "%"; }

function setLive(ok, msg) {
  const l = $("live");
  l.textContent = ok ? "LIVE" : (msg || "DISCONNECTED");
  l.className = ok ? "live" : "live dead";
}

function connect() {
  if (es) es.close();
  es = new EventSource("/events");
  es.addEventListener("state", (e) => {
    S = JSON.parse(e.data);
    offset = Date.now() - S.now;
    setLive(true);
    render();
  });
  es.onerror = () => { setLive(false); es.close(); es = null; setTimeout(probe, 2000); };
}
// EventSource gives up silently on a 401 (e.g. the panel restarted with a new token),
// so probe with fetch to tell "server down" from "session expired".
async function probe() {
  try {
    const r = await fetch("/api/state", { cache: "no-store" });
    if (r.status === 401) { setLive(false, "DISCONNECTED · open the new URL printed by clauductor panel"); setTimeout(probe, 5000); return; }
    if (!r.ok) throw new Error(r.status);
  } catch (e) { setLive(false); setTimeout(probe, 2000); return; }
  connect();
}

function gauge(id, v) {
  const g = $(id), f = g.querySelector(".fill");
  g.querySelector("b").textContent = pct(v);
  f.style.width = (v == null ? 0 : Math.min(100, v)) + "%";
  f.className = "fill" + (v >= 90 ? " s" : v >= 70 ? " h" : "");
}

function laneStatusText(l) {
  if (l.status === "waiting") return "waiting" + (l.waitingFor ? ": " + l.waitingFor : "");
  let t = l.status === "none" ? "no session" : l.status;
  if (l.subagents.length) t += " · " + l.subagents.length + " subagent" + (l.subagents.length > 1 ? "s" : "");
  if (l.sessions.length > 1) t += " · " + l.sessions.length + " sessions";
  return t;
}

function laneCard(l, quiet) {
  const c = el("div", "lane " + l.status + (l.stale ? " stale" : "") + (l.id === selected ? " sel" : "") + (quiet ? " quiet" : ""), null, [
    el("div", "row", null, [el("span", "nm", l.name), el("span", "kind", l.type)]),
    el("div", "sub", l.branch || "(detached)"),
  ]);
  if (!quiet) {
    c.appendChild(el("div", "row", null, [
      el("span", "sub" + (l.status === "waiting" ? " hold" : ""), laneStatusText(l)),
      el("span", "sub", "ctx " + pct(l.ctxPct)),
    ]));
    const bar = el("div", "ctx", null, [el("i")]);
    bar.firstChild.style.width = (l.ctxPct || 0) + "%";
    c.appendChild(bar);
    c.appendChild(el("div", "sub", l.lastEventAt ? "last: " + l.lastEvent + " · " + age(l.lastEventAt) + " ago" : "no hook event yet"));
  }
  c.addEventListener("click", () => { selected = l.id; try { localStorage.setItem("clauductor-panel-lane", l.id); } catch (e) {} render(); });
  return c;
}

function feedList(items, withLane) {
  if (!items.length) return el("div", "empty", "no events yet");
  const f = el("div", "feed");
  for (const e of items) {
    const d = el("span", "d", (withLane ? e.name + " · " : "") + e.event);
    if (e.detail) d.appendChild(el("span", "dim", e.detail));
    d.title = (e.name || "") + " · " + e.event + (e.detail ? " · " + e.detail : "");
    f.appendChild(el("div", "ev", null, [el("span", "t", hhmm(e.at)), d]));
  }
  return f;
}

function sourceNote(src, what) {
  if (!src) return null;
  if (src.pending) return el("div", "empty", "reading " + what + "…");
  if (!src.ok) return el("div", "card err", "cannot read " + what + ": " + src.error);
  return null;
}

function renderJSON(v) {
  if (Array.isArray(v)) {
    if (!v.length) return el("div", "empty", "(empty)");
    const ul = el("ul");
    for (const it of v) {
      if (it !== null && typeof it === "object" && !Array.isArray(it)) {
        const main = it.title ?? it.name ?? it.text ?? it.summary ?? it.id;
        const rest = Object.entries(it).filter(([k, x]) => x !== main && (x === null || typeof x !== "object")).map(([k, x]) => k + ": " + x);
        const li = el("li", null, main != null ? String(main) : "");
        if (rest.length) li.appendChild(el("div", "dim", rest.join(" · ")));
        ul.appendChild(li);
      } else ul.appendChild(el("li", null, typeof it === "string" ? it : JSON.stringify(it)));
    }
    return ul;
  }
  if (v !== null && typeof v === "object") {
    const kv = el("div", "kv");
    for (const [k, x] of Object.entries(v)) {
      kv.appendChild(el("span", "dim", k));
      kv.appendChild(x !== null && typeof x === "object" ? renderJSON(x) : el("span", null, String(x)));
    }
    return kv;
  }
  return el("div", null, String(v));
}

function projectCard(c) {
  const card = el("div", "card" + (!c.source.pending && !c.source.ok ? " err" : ""), null, [
    el("div", "row", null, [el("b", null, c.title || c.id), el("span", "sub", c.source.at ? age(c.source.at) + " ago" : "")]),
  ]);
  if (c.source.pending) card.appendChild(el("div", "empty", "running…"));
  else if (!c.source.ok) card.appendChild(el("div", "stop", "cannot read: " + c.source.error));
  else if (c.output.kind === "json") card.appendChild(renderJSON(c.output.json));
  else if (!c.output.lines || !c.output.lines.length) card.appendChild(el("div", "empty", "(no output)"));
  else {
    const ul = el("ul");
    for (const line of c.output.lines) ul.appendChild(el("li", null, line.replace(/^\s*(?:[-*+]|\d+\.)\s+/, "")));
    card.appendChild(ul);
  }
  return card;
}

function render() {
  if (!S) return;
  document.title = S.name + " · Panel";
  $("pname").textContent = S.name;
  gauge("g5", S.quota ? S.quota.fiveHour : null);
  gauge("g7", S.quota ? S.quota.sevenDay : null);
  $("cost").textContent = S.estCostUsd == null ? "—" : S.estCostUsd.toFixed(2);
  $("hookn").textContent = S.hookEvents + " · status " + S.statusPosts + (S.dropped ? " · dropped " + S.dropped : "");

  const banners = $("banners");
  banners.replaceChildren();
  const bannerTexts = [...S.banners];
  for (const [k, src] of Object.entries(S.sources)) if (k !== "prs" && !src.pending && !src.ok) bannerTexts.push("cannot read " + k + ": " + src.error);
  for (const t of bannerTexts) banners.appendChild(el("div", "banner", null, [el("b", null, "NO SIGNAL"), document.createTextNode(t)]));

  // Left: lanes.
  const left = $("left");
  left.replaceChildren(el("div", "mh", "Lanes · " + S.lanes.length));
  const aSrc = sourceNote(S.sources.agents, "claude agents");
  if (aSrc) left.appendChild(aSrc);
  if (!S.lanes.length) left.appendChild(el("div", "empty", "no Claude session in this project's worktrees"));
  for (const l of S.lanes) left.appendChild(laneCard(l, false));
  if (S.quietWorktrees.length) {
    left.appendChild(el("div", "mh", "Worktrees · no session · " + S.quietWorktrees.length));
    for (const l of S.quietWorktrees) left.appendChild(laneCard(l, true));
  }

  // Centre: the selected lane.
  const all = S.lanes.concat(S.quietWorktrees);
  let lane = all.find((l) => l.id === selected) || S.lanes[0] || all[0];
  if (lane && lane.id !== selected) selected = lane.id;
  const centre = $("centre");
  centre.replaceChildren();
  if (lane) {
    const chips = el("div", "chips", null, [
      el("span", "chip sig", lane.type),
      el("span", "chip " + ({ busy: "go", waiting: "hold" }[lane.status] || ""), lane.status === "none" ? "no session" : lane.status),
      el("span", "chip", "ctx " + pct(lane.ctxPct)),
      el("span", "chip", "last hook " + (lane.lastHookAt ? age(lane.lastHookAt) + " ago" : "never")),
    ]);
    if (lane.stale) chips.appendChild(el("span", "chip stop", "no hooks while busy"));
    const sum = el("div", "summary", null, [
      el("h2", null, lane.name), chips,
      el("div", "sub", lane.branch + " · " + lane.path),
    ]);
    if (lane.sessions.length) {
      const tb = el("tbody");
      for (const s of lane.sessions) {
        tb.appendChild(el("tr", null, [
          el("td", null, s.name || s.id.slice(0, 8)), el("td", null, s.pid ? String(s.pid) : "—"), el("td", null, s.kind || "hooks only"),
          el("td", { busy: "go", waiting: "hold" }[s.status] || "", s.status + (s.waitingFor ? " · " + s.waitingFor : "")),
          el("td", null, pct(s.ctxPct)), el("td", null, s.model || "—"),
          el("td", null, s.estCostUsd == null ? "—" : "$" + s.estCostUsd.toFixed(2)),
        ]));
      }
      const th = el("tr", null, ["session", "pid", "kind", "status", "ctx", "model", "est. $"].map((h) => el("th", null, h)));
      sum.appendChild(el("div", "tablewrap", null, [el("table", null, [el("thead", null, [th]), tb])]));
    }
    sum.appendChild(el("div", "mh", "Running subagents · " + lane.subagents.length));
    if (lane.subagents.length) {
      const ul = el("div", "feed");
      for (const a of lane.subagents) ul.appendChild(el("div", "ev", null, [el("span", "t", age(a.since)), el("span", "d", (a.type || "(untyped)") + " " + a.id.slice(0, 7))]));
      sum.appendChild(ul);
    } else sum.appendChild(el("div", "empty", "none"));
    centre.appendChild(sum);
    centre.appendChild(el("div", "mh", "Events · " + lane.name));
    centre.appendChild(feedList(S.feed.filter((e) => e.lane === lane.id), false));
  } else centre.appendChild(el("div", "empty", "no worktrees"));

  // Right: needs you, cards, PRs, global feed.
  const right = $("right");
  right.replaceChildren(el("div", "mh", "Needs you · " + S.needsYou.length));
  if (!S.needsYou.length) right.appendChild(el("div", "empty", "nothing waiting on you"));
  for (const n of S.needsYou) {
    const label = { permission_prompt: "Permission", idle_prompt: "Idle, waiting for input", waiting: "Waiting" }[n.kind] || n.kind;
    const c = el("div", "card ask", null, [el("b", null, n.name), el("div", null, label + (n.text ? ": " + n.text : "")),
      el("div", "sub", n.at ? age(n.at) + " ago" : "")]);
    c.style.cursor = "pointer";
    c.addEventListener("click", () => { selected = n.lane; render(); });
    right.appendChild(c);
  }
  for (const c of S.cards) right.appendChild(projectCard(c));

  right.appendChild(el("div", "mh", "Open PRs · " + (S.sources.prs.ok ? S.prs.length : "?")));
  const pSrc = sourceNote(S.sources.prs, "gh pr list");
  if (pSrc) right.appendChild(pSrc);
  if (S.sources.prs.ok && !S.prs.length) right.appendChild(el("div", "empty", "none open"));
  for (const p of S.prs) {
    const checks = p.checksFail ? el("span", "stop", p.checksFail + " failing") : p.checksPending ? el("span", "hold", p.checksPending + " pending")
      : p.checksPass ? el("span", "go", p.checksPass + " passing") : el("span", "dim", "no checks");
    right.appendChild(el("div", "card" + (S.sources.prs.ok ? "" : " dim"), null, [
      el("div", "mono", "#" + p.number + " " + p.headRefName),
      el("div", null, p.title),
      el("div", "sub", null, [document.createTextNode((p.isDraft ? "draft · " : "") + p.author + " · "), checks]),
    ]));
  }

  right.appendChild(el("div", "mh", "Feed"));
  right.appendChild(feedList(S.feed.slice(0, 60), true));
}

$("refresh").addEventListener("click", () => { fetch("/api/refresh", { method: "POST" }).catch(() => {}); });
setInterval(render, 1000); // ages move between server pushes
connect();
</script>
</body>
</html>
